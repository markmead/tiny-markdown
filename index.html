<!doctype html>
<html
  lang="en"
  x-data="{ darkMode: $persist(globalThis.matchMedia('(prefers-color-scheme: dark)').matches) }"
  :class="{ 'dark': darkMode }"
  x-effect="document.getElementById('theme-color').content = darkMode ? '#0B0B0B' : '#FAFAFA'"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiny Markdown 🤏 | Simple Markdown Editor</title>

    <!--
      Design tokens. Every surface colour resolves through these, so the
      `dark` class on <html> is the only thing that switches the theme.

      Elevation reads the same way in both themes: raised surfaces are
      lighter than the page they sit on.
    -->
    <style>
      :root {
        --page: #fafafa;
        --paper: #ffffff;
        --surface: #ffffff;
        --border: #d8d8d8;
        --hover: #f1f1f1;
        --active: #e7e7e7;
        --ink: #141414;
        --ink-muted: #5c5c5c;
        --accent: #db2777;
        --danger: #dc2626;

        color-scheme: light;
      }

      .dark {
        --page: #0b0b0b;
        --paper: #131313;
        --surface: #171717;
        --border: #363636;
        --hover: #232323;
        --active: #2b2b2b;
        --ink: #f2f2f2;
        --ink-muted: #9e9e9e;
        --accent: #f472b6;
        --danger: #f87171;

        color-scheme: dark;
      }

      /*
        Alpine's x-cloak is inert without this rule. Kept inline rather than
        in Tailwind so it applies before any script has run.
      */
      [x-cloak] {
        display: none !important;
      }

      .no-scrollbar {
        scrollbar-width: none;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      /*
        Preview styling lives here rather than in prose-* utilities so it can
        beat the typography plugin's :where() selectors without !important.
      */
      .markdown-preview pre {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--ink);
      }

      .markdown-preview a {
        color: var(--accent);
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>

    <!--
      Blocking so the persisted theme lands before first paint. Alpine loads
      deferred from a CDN, so its `dark` binding only applies once the page has
      already flashed light. Reads Alpine Persist's `_x_` localStorage key.
      Everything else about the theme, theme-color included, stays Alpine's.
    -->
    <script>
      try {
        const storedPreference = localStorage.getItem('_x_darkMode')

        const prefersDark =
          storedPreference === null
            ? globalThis.matchMedia('(prefers-color-scheme: dark)').matches
            : JSON.parse(storedPreference)

        if (prefersDark) {
          document.documentElement.classList.add('dark')
        }
      } catch {
        /* Storage blocked or corrupt — Alpine settles the theme once it boots. */
      }
    </script>

    <meta id="theme-color" name="theme-color" content="#FAFAFA" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

      defer
      src="https://cdn.jsdelivr.net/npm/@alpinejs/persist@3.15.12/dist/cdn.min.js"
      integrity="sha256-532TLFLOYWwqXF3EVTCgIhkRoxqrSKF56GgJMtTTqkc="

    ></script>

    <script

      crossorigin="anonymous"
    ></script>

      crossorigin="anonymous"
    ></script>

    <script
      src="https://cdn.jsdelivr.net/npm/slugify@1.6.9/slugify.min.js"
      integrity="sha256-UihlZwuxD7CK3PUx1p/+/QFj/te+wOyCVAehLNCXoN8="
      crossorigin="anonymous"
    ></script>

    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        plugins: [
          /*
            Preview HTML is injected by marked, so its checkboxes can't carry
            classes. This variant lets utilities on the article reach them.
          */
          function ({ addVariant }) {
            addVariant(
              'prose-checkbox',
              '&.prose :where(input[type="checkbox"])',
            )
          },
        ],
        theme: {
          extend: {
            colors: {
              page: 'var(--page)',
              paper: 'var(--paper)',
              surface: 'var(--surface)',
              line: 'var(--border)',
              hover: 'var(--hover)',
              active: 'var(--active)',
              ink: 'var(--ink)',
              'ink-muted': 'var(--ink-muted)',
              accent: 'var(--accent)',
              danger: 'var(--danger)',
            },
            fontFamily: {
              sans: [
                'Bricolage Grotesque',
                'ui-sans-serif',
                'system-ui',
                'sans-serif',
              ],
              mono: [
                'Inconsolata',
                'ui-monospace',
                'SFMono-Regular',
                'Menlo',
                'Consolas',
                'monospace',
              ],
            },
          },
        },
      }
    </script>
  </head>
  <body
    x-data="markdownEditor"
    x-effect="refreshHtml"
    class="font-sans bg-page text-ink"
  >
    <noscript>
      <div

          padding: 1.5rem;
          font-family: system-ui, sans-serif;
          font-size: 0.875rem;
          line-height: 1.6;
        "

        <strong>Tiny Markdown needs JavaScript.</strong> The editor and preview
        both render in the browser, so there is nothing to show without it.
        Enable JavaScript and reload to start writing.
      </div>
    </noscript>

    <main>

        :class="{ 'lg:grid-cols-1': isFullscreen }"

        >

          >
            <h1 class="text-lg font-bold">
              Tiny Markdown
              <span aria-hidden="true"> 🤏 </span>
            </h1>

            <div class="flex gap-4">

                <div class="relative">
                  <button
                    @click="toggleRevisionMenu"
                    @keydown.escape.prevent="closeRevisionMenu"
                    x-ref="revisionMenuTrigger"
                    id="revision-menu-button"
                    aria-haspopup="menu"
                    :aria-expanded="showRevisionMenu"
                    aria-controls="revision-menu"
                    aria-label="Revision history"
                    data-tooltip="Revision history"
                    :class="menuTriggerButtonClass"
                  >
                    <span
                      class="text-xs font-medium"
                      x-text="selectedRevisionLabel"
                    ></span>

                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      class="size-4"
                      aria-hidden="true"
                    >
                      <path d="m6 9 6 6 6-6" />
                    </svg>
                  </button>

                  <div
                    id="revision-menu"
                    class="absolute right-0 z-10 w-64 mt-4 origin-top-right border rounded-md max-h-64 overflow-auto bg-surface border-line"
                    role="menu"
                    aria-labelledby="revision-menu-button"
                    x-show="showRevisionMenu"
                    x-cloak
                    @click.away="closeRevisionMenu(false)"
                    @keydown.escape.prevent="closeRevisionMenu"
                  >
                    <template x-if="contentRevisions.length">
                      <ul class="p-2" role="none">
                        <template
                          x-for="contentRevision in contentRevisions"
                          :key="contentRevision.revisionKey"
                        >
                          <li
                            class="flex justify-between gap-2 p-1 items-center rounded-md hover:bg-hover"
                            role="none"
                          >
                            <button
                              @click="selectRevision(contentRevision.revisionKey, contentRevision.revisionLabel)"
                              role="menuitem"
                              :aria-current="contentRevision.revisionKey === selectedRevisionKey"
                              class="flex-1 px-2 py-1 text-left rounded-md text-xs font-medium transition-colors hover:text-accent focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent"
                              :class="contentRevision.revisionKey === selectedRevisionKey ? 'text-accent' : ''"
                              x-text="contentRevision.revisionLabel"
                            ></button>

                            <button
                              @click="removeRevision(contentRevision.revisionKey)"
                              role="menuitem"
                              :aria-label="`Delete revision from ${contentRevision.revisionLabel}`"
                              data-tooltip="Delete revision"
                              class="grid p-1 rounded-md size-7 place-content-center transition-colors hover:text-danger focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent"
                            >
                              <svg
                                xmlns="http://www.w3.org/2000/svg"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                class="size-4"
                                aria-hidden="true"
                              >
                                <path d="M10 11v6" />
                                <path d="M14 11v6" />
                                <path
                                  d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"
                                />
                                <path d="M3 6h18" />
                                <path
                                  d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
                                />
                              </svg>
                            </button>
                          </li>
                        </template>
                      </ul>
                    </template>

                    <template x-if="! contentRevisions.length">
                      <p class="p-4 text-xs font-medium text-ink-muted">
                        No saved revisions yet. Save one to come back to it.
                      </p>
                    </template>

                    <div x-show="contentRevisions.length" class="p-2 border-t border-line">
                      <button
                        class="flex items-center gap-2 p-2 w-full rounded-md text-xs font-medium text-danger transition-colors hover:bg-hover focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-inset"

                        role="menuitem"
                      >
                        <svg
                          xmlns="http://www.w3.org/2000/svg"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          class="size-4"
                          aria-hidden="true"
                        >
                          <path d="M10 11v6" />
                          <path d="M14 11v6" />
                          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                          <path d="M3 6h18" />
                          <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                        </svg>

                        Delete all revisions

              </div>

    <!--

      @pointerout.window="hideTooltip($event)"

        :style="`left: ${tooltipLeft}px; top: ${tooltipTop}px;`"
        class="fixed z-50 px-2 py-1 text-xs font-medium border rounded-md shadow-sm pointer-events-none whitespace-nowrap bg-surface border-line text-ink"
        x-text="tooltipText"
      ></div>
    </div>

    <script>
      const REVISION_PREFIX = '_TM_'
      const NOTIFICATION_DURATION = 2500
      const NOTIFICATION_LEAVE_DURATION = 150
      const MAX_MARKDOWN_SIZE = 50000
      const DEFAULT_REVISION_LABEL = 'Current draft'
      const DEFAULT_REVISION_KEY = null
      const RENDER_DEBOUNCE = 100
      const INDENT = '  '
      const OUTDENT_PATTERN = /^ {1,2}/
      const TOOLTIP_OFFSET = 8
      const TOOLTIP_EDGE_GAP = 8
      const NEAR_SIZE_LIMIT_RATIO = 0.9
      const DESKTOP_MEDIA_QUERY = '(min-width: 1024px)'

      const IS_APPLE_DEVICE = /Mac|iPhone|iPad|iPod/.test(
        navigator.platform || navigator.userAgent,
      )

      const SHORTCUT_MODIFIER = IS_APPLE_DEVICE ? '⌘' : 'Ctrl+'

      const DEFAULT_MARKDOWN = [
        '# Tiny Markdown',
        '',
        'A **single HTML file** that turns markdown into a document, live.',
        '',
        '## Try it',
        '',
        '- [x] Type in the left pane',
        '- [ ] Use the toolbar, or the keyboard shortcuts behind it',
        '- [ ] Save a revision when you want a checkpoint',
        '',
        '## Syntax at a glance',
        '',
        '| Write | Get |',
        '| --- | --- |',
        '| `**bold**` | **bold** |',
        '| `_italic_` | _italic_ |',
        '| `~~strike~~` | ~~strike~~ |',
        '',
        '> Everything stays in your browser. Nothing is uploaded.',
      ].join('\n')

      /**
       * Line-start syntax, keyed by the marker each toolbar button inserts.
       * The pattern decides whether a line already carries that syntax, which
       * is what makes the buttons toggle rather than stack markers.
       */
      const BLOCK_SYNTAX_PATTERNS = {
        '# ': /^# +/,
        '## ': /^## +/,
        '### ': /^### +/,
        '- ': /^[-*+] +(?!\[[ xX]\] )/,
        '1. ': /^\d+\. +/,
        '> ': /^> +/,
        '- [ ] ': /^[-*+] +\[[ xX]\] +/,
      }

      /** Any block marker, stripped before a new one is applied so they don't nest. */
      const ANY_BLOCK_SYNTAX =
        /^(?:#{1,6} +|> +|[-*+] +\[[ xX]\] +|[-*+] +|\d+\. +)/

      /**
       * Render bookkeeping lives outside the Alpine component so writing to it
       * never re-triggers the x-effect that drives rendering.
       */
      let renderTimeoutId = null
      let hasRenderedInitialHtml = false
      let hasPreviewParseError = false
      let isSyncingScroll = false

      const revisionStore = {
        saveEntry(markdownContent) {
          localStorage.setItem(
            `${REVISION_PREFIX}${new Date().getTime()}`,
            `${markdownContent}`,
          )
        },

        removeEntry(localStorageRevisionKey) {
          localStorage.removeItem(localStorageRevisionKey)
        },

        removeAllEntries() {
          const localStorageRevisionKeys = Object.keys(localStorage).filter(
            (localStorageKey) => localStorageKey.startsWith(REVISION_PREFIX),
          )

          localStorageRevisionKeys.forEach((localStorageRevisionKey) =>
            localStorage.removeItem(localStorageRevisionKey),
          )
        },

        listEntries() {
          const localStorageRevisions = Object.keys(localStorage)
            .filter((localStorageKey) =>
              localStorageKey.startsWith(REVISION_PREFIX),
            )
            .sort((firstDate, secondDate) => {
              const firstDateAsTimestamp = firstDate.replace(
                REVISION_PREFIX,
                '',
              )

              const secondDateAsTimestamp = secondDate.replace(
                REVISION_PREFIX,
                '',
              )

              return (
                new Date(Number(secondDateAsTimestamp)) -
                new Date(Number(firstDateAsTimestamp))
              )
            })

          return localStorageRevisions.map((localStorageRevisionKey) => {
            const localStorageRevisionKeyAsTimestamp =
              localStorageRevisionKey.replace(REVISION_PREFIX, '')

            const formattedDate = new Date(
              Number(localStorageRevisionKeyAsTimestamp),
            ).toLocaleString()

            return {
              revisionKey: localStorageRevisionKey,
              revisionLabel: formattedDate,
            }
          })
        },

        getEntry(localStorageRevisionKey) {
          return localStorage.getItem(localStorageRevisionKey)
        },
      }

      const markdownService = {
        /**
         * Applies or removes line-start syntax across every line the selection touches
         * @param {string} markdownContent - Full editor content
         * @param {number} selectionStart - Caret or selection start offset
         * @param {number} selectionEnd - Selection end offset
         * @param {string} blockPrefix - Marker to toggle, e.g. '## ' or '- [ ] '
         * @returns {{updatedContent: string, updatedSelectionStart: number, updatedSelectionEnd: number}}
         * @description
         * Expands the selection to whole lines first, so the marker always lands
         * at the start of a line rather than wherever the caret happened to be.
         * Removes the marker when every non-empty line already has it, otherwise
         * strips any competing block marker and applies the new one. Ordered lists
         * are renumbered from one.
         */
        applyBlockSyntax(
          markdownContent,
          selectionStart,
          selectionEnd,
          blockPrefix,
        ) {
          const appliedPattern = BLOCK_SYNTAX_PATTERNS[blockPrefix]

          const blockStart =
            markdownContent.lastIndexOf('\n', selectionStart - 1) + 1

          const nextNewlineIndex = markdownContent.indexOf('\n', selectionEnd)

          const blockEnd =
            nextNewlineIndex === -1 ? markdownContent.length : nextNewlineIndex

          const blockLines = markdownContent
            .slice(blockStart, blockEnd)
            .split('\n')

          const filledLines = blockLines.filter(
            (blockLine) => blockLine.trim() !== '',
          )

          const isAlreadyApplied =
            filledLines.length > 0 &&
            filledLines.every((blockLine) => appliedPattern.test(blockLine))

          let orderedListNumber = 0

          const updatedLines = blockLines.map((blockLine) => {
            if (blockLine.trim() === '') {
              return blockLine
            }

            const bareLine = blockLine.replace(ANY_BLOCK_SYNTAX, '')

            if (isAlreadyApplied) {
              return bareLine
            }

            orderedListNumber += 1

            return blockPrefix === '1. '
              ? `${orderedListNumber}. ${bareLine}`
              : `${blockPrefix}${bareLine}`
          })

          const updatedBlock = updatedLines.join('\n')
          const lengthDelta = updatedBlock.length - (blockEnd - blockStart)
          const isCollapsedSelection = selectionStart === selectionEnd

          const collapsedCaret = Math.max(
            blockStart,
            selectionStart + lengthDelta,
          )

          return {
            updatedContent: `${markdownContent.slice(0, blockStart)}${updatedBlock}${markdownContent.slice(blockEnd)}`,
            updatedSelectionStart: isCollapsedSelection
              ? collapsedCaret
              : blockStart,
            updatedSelectionEnd: isCollapsedSelection
              ? collapsedCaret
              : blockStart + updatedBlock.length,
          }
        },

        /**
         * Wraps or unwraps the selection with paired inline syntax
         * @param {string} markdownContent - Full editor content
         * @param {number} selectionStart - Caret or selection start offset
         * @param {number} selectionEnd - Selection end offset
         * @param {string} syntaxBefore - Opening marker, e.g. '**'
         * @param {string} syntaxAfter - Closing marker, e.g. '**'
         * @returns {{updatedContent: string, updatedSelectionStart: number, updatedSelectionEnd: number}}
         * @description
         * Only unwraps when the markers genuinely bracket the selection — either
         * just inside it or immediately outside it. Checking for the marker
         * anywhere in the selection would strip the underscore out of snake_case.
         * With nothing selected the caret lands between the markers, ready to type.
         */
        applyInlineSyntax(
          markdownContent,
          selectionStart,
          selectionEnd,
          syntaxBefore,
          syntaxAfter,
        ) {
          const selectedText = markdownContent.slice(
            selectionStart,
            selectionEnd,
          )

          const isFencedBlock = syntaxBefore === '```'
          const openMarker = isFencedBlock ? '```\n' : syntaxBefore
          const closeMarker = isFencedBlock ? '\n```' : syntaxAfter

          const isWrappedInside =
            selectedText.length >= openMarker.length + closeMarker.length &&
            selectedText.startsWith(openMarker) &&
            selectedText.endsWith(closeMarker)

          if (isWrappedInside) {
            const unwrappedText = selectedText.slice(
              openMarker.length,
              selectedText.length - closeMarker.length,
            )

            return {
              updatedContent: `${markdownContent.slice(0, selectionStart)}${unwrappedText}${markdownContent.slice(selectionEnd)}`,
              updatedSelectionStart: selectionStart,
              updatedSelectionEnd: selectionStart + unwrappedText.length,
            }
          }

          const isWrappedOutside =
            markdownContent.slice(
              selectionStart - openMarker.length,
              selectionStart,
            ) === openMarker &&
            markdownContent.slice(
              selectionEnd,
              selectionEnd + closeMarker.length,
            ) === closeMarker

          if (isWrappedOutside) {
            const unwrappedStart = selectionStart - openMarker.length

            return {
              updatedContent: `${markdownContent.slice(0, unwrappedStart)}${selectedText}${markdownContent.slice(selectionEnd + closeMarker.length)}`,
              updatedSelectionStart: unwrappedStart,
              updatedSelectionEnd: unwrappedStart + selectedText.length,
            }
          }

          return {
            updatedContent: `${markdownContent.slice(0, selectionStart)}${openMarker}${selectedText}${closeMarker}${markdownContent.slice(selectionEnd)}`,
            updatedSelectionStart: selectionStart + openMarker.length,
            updatedSelectionEnd:
              selectionStart + openMarker.length + selectedText.length,
          }
        },

        /**
         * Indents or outdents the lines the selection touches
         * @param {string} markdownContent - Full editor content
         * @param {number} selectionStart - Caret or selection start offset
         * @param {number} selectionEnd - Selection end offset
         * @param {boolean} shouldOutdent - True when Shift was held
         * @returns {{updatedContent: string, updatedSelectionStart: number, updatedSelectionEnd: number}}
         */
        applyIndent(
          markdownContent,
          selectionStart,
          selectionEnd,
          shouldOutdent,
        ) {
          const isCollapsedSelection = selectionStart === selectionEnd

          if (isCollapsedSelection && !shouldOutdent) {
            const caretAfterIndent = selectionStart + INDENT.length

            return {
              updatedContent: `${markdownContent.slice(0, selectionStart)}${INDENT}${markdownContent.slice(selectionEnd)}`,
              updatedSelectionStart: caretAfterIndent,
              updatedSelectionEnd: caretAfterIndent,
            }
          }

          const blockStart =
            markdownContent.lastIndexOf('\n', selectionStart - 1) + 1

          const nextNewlineIndex = markdownContent.indexOf('\n', selectionEnd)

          const blockEnd =
            nextNewlineIndex === -1 ? markdownContent.length : nextNewlineIndex

          const updatedBlock = markdownContent
            .slice(blockStart, blockEnd)
            .split('\n')
            .map((blockLine) =>
              shouldOutdent
                ? blockLine.replace(OUTDENT_PATTERN, '')
                : `${INDENT}${blockLine}`,
            )
            .join('\n')

          return {
            updatedContent: `${markdownContent.slice(0, blockStart)}${updatedBlock}${markdownContent.slice(blockEnd)}`,
            updatedSelectionStart: blockStart,
            updatedSelectionEnd: blockStart + updatedBlock.length,
          }
        },

        enforceSizeLimit(markdownContent) {
          if (markdownContent.length <= MAX_MARKDOWN_SIZE) {
            return {
              validatedContent: markdownContent,
              exceedsSizeLimit: false,
            }
          }

          return {
            validatedContent: markdownContent.substring(0, MAX_MARKDOWN_SIZE),
            exceedsSizeLimit: true,
          }
        },

        renderSanitizedHtml(markdownContent) {
          try {
            const rawHtml = marked.parse(markdownContent)

            return {
              sanitizedHtml: DOMPurify.sanitize(rawHtml),
              containsParseError: false,
            }
          } catch {
            return {
              sanitizedHtml: `<p>${DOMPurify.sanitize(markdownContent, {
                ALLOWED_TAGS: [],
                ALLOWED_ATTR: [],
                ALLOW_ARIA_ATTR: false,
                ALLOW_DATA_ATTR: false,
              })}</p>`,
              containsParseError: true,
            }
          }
        },
        /**
         * Extracts the first H1 (# ) from markdown content
         * Returns null if not found
         */
        extractH1(markdownContent) {
          const [_, h1Content] = markdownContent.match(/^#\s+(.+)/m) || []

          return h1Content ? h1Content.trim() : null
        },
      }

      const exportService = {
        createFileName(fileExtension, markdownContent) {
          const exportTitle =
            markdownService.extractH1(markdownContent) ?? 'Tiny Markdown'
          const sluggedTitle = slugify(exportTitle, {
            lower: true,
            strict: true,
          })

          const exportTimestamp = Date.now()

          return `${sluggedTitle}-${exportTimestamp}.${fileExtension}`
        },

        downloadFile(fileContent, fileName, fileType) {
          const exportBlob = new Blob([fileContent], { type: fileType })
          const exportUrl = URL.createObjectURL(exportBlob)
          const exportLink = document.createElement('a')

          exportLink.href = exportUrl
          exportLink.download = fileName

          exportLink.click()

          URL.revokeObjectURL(exportUrl)
        },

        exportMarkdown(markdownContent) {
          this.downloadFile(
            markdownContent,
            this.createFileName('md', markdownContent),
            'text/markdown;charset=utf-8',
          )
        },
      }

      const notificationService = {
        createNotification(textContent, iconText, isAssertive) {
          const notificationId = Date.now() + Math.random()

          return {
            notificationId,
            textContent,
            iconText,
            isAssertive,
            isVisible: false,
          }
        },

        addNotification(notificationMessages, notificationMessage) {
          return [...notificationMessages, notificationMessage]
        },

        setNotificationVisibility(
          notificationMessages,
          notificationId,
          isVisible,
        ) {
          return notificationMessages.map((currentNotification) =>
            currentNotification.notificationId === notificationId
              ? { ...currentNotification, isVisible }
              : currentNotification,
          )
        },

        removeNotification(notificationMessages, notificationId) {
          return notificationMessages.filter(
            (currentNotification) =>
              currentNotification.notificationId !== notificationId,
          )
        },

        addTimeout(notificationTimeouts, notificationId, timeoutId) {
          return {
            ...notificationTimeouts,
            [notificationId]: timeoutId,
          }
        },

        removeTimeout(notificationTimeouts, notificationId) {
          return Object.fromEntries(
            Object.entries(notificationTimeouts).filter(
              ([timeoutNotificationId]) =>
                Number(timeoutNotificationId) !== notificationId,
            ),
          )
        },

        findNotification(notificationMessages, notificationId) {
          return notificationMessages.find(
            (currentNotification) =>
              currentNotification.notificationId === notificationId,
          )
        },
      }

      document.addEventListener('alpine:init', () => {
        /**
         * Single shared tooltip for every icon-only control
         * @description
         * Uses one fixed-position element driven by delegated pointer and focus
         * events, so tooltips are not clipped by the toolbar's horizontal scroll
         * container and cost nothing per button beyond a data-tooltip attribute.
         * Skips touch pointers and non-keyboard focus.
         */
        Alpine.data('tooltipLayer', () => ({
          tooltipText: '',
          isVisible: false,
          tooltipLeft: 0,
          tooltipTop: 0,

          showTooltip(triggerEvent) {
            if (triggerEvent.pointerType === 'touch') {
              return
            }

            const tooltipHost = triggerEvent.target.closest?.('[data-tooltip]')

            if (!tooltipHost) {
              this.hideTooltip()

              return
            }

            const isNonKeyboardFocus =
              triggerEvent.type === 'focusin' &&
              !tooltipHost.matches(':focus-visible')

            if (isNonKeyboardFocus) {
              return
            }

            this.tooltipText = tooltipHost.dataset.tooltip
            this.isVisible = true

            this.$nextTick(() => this.positionTooltip(tooltipHost))
          },

          /**
           * Hides the tooltip, ignoring moves within the trigger it belongs to
           * @param {PointerEvent|FocusEvent} [leaveEvent] - Omitted for scroll and Escape
           * @description
           * `pointerout` and `focusout` also fire when the pointer or focus
           * crosses into a descendant of the trigger — its `<svg>`, say — which
           * would flicker the tooltip off and straight back on.
           */
          hideTooltip(leaveEvent) {
            const tooltipHost = leaveEvent?.target?.closest?.('[data-tooltip]')

            const stayedWithinHost =
              leaveEvent?.relatedTarget instanceof Node &&
              tooltipHost?.contains(leaveEvent.relatedTarget)

            if (stayedWithinHost) {
              return
            }

            this.isVisible = false
          },

          /**
           * Centres the tooltip under its trigger, flipping above and clamping
           * to the viewport when there isn't room.
           */
          positionTooltip(tooltipHost) {
            const hostBounds = tooltipHost.getBoundingClientRect()
            const tooltipBounds = this.$refs.tooltip.getBoundingClientRect()

            const centredLeft =
              hostBounds.left + hostBounds.width / 2 - tooltipBounds.width / 2

            const furthestLeft =
              globalThis.innerWidth - tooltipBounds.width - TOOLTIP_EDGE_GAP

            this.tooltipLeft = Math.round(
              Math.min(
                Math.max(centredLeft, TOOLTIP_EDGE_GAP),
                Math.max(furthestLeft, TOOLTIP_EDGE_GAP),
              ),
            )

            const topWhenBelow = hostBounds.bottom + TOOLTIP_OFFSET

            const fitsBelow =
              topWhenBelow + tooltipBounds.height <=
              globalThis.innerHeight - TOOLTIP_EDGE_GAP

            this.tooltipTop = Math.round(
              fitsBelow
                ? topWhenBelow
                : hostBounds.top - tooltipBounds.height - TOOLTIP_OFFSET,
            )
          },
        }))

        /**
         * Edge fades for the horizontally scrolling toolbar
         * @description
         * The scrollbar is hidden, so without these there is nothing to say the
         * toolbar continues past the viewport on narrow screens.
         */
        Alpine.data('scrollFade', () => ({
          canScrollStart: false,
          canScrollEnd: false,

          init() {
            this.updateScrollState()

            new ResizeObserver(() => this.updateScrollState()).observe(
              this.$refs.scroller,
            )
          },

          updateScrollState() {
            const scrollerElement = this.$refs.scroller

            this.canScrollStart = scrollerElement.scrollLeft > 1

            this.canScrollEnd =
              scrollerElement.scrollLeft + scrollerElement.clientWidth <
              scrollerElement.scrollWidth - 1
          },
        }))

        /**
         * Main Alpine.js component for TinyMarkdown editor
         * @description
         * Real-time markdown editor with live preview, secure sanitization, revision history,
         * and persistent preferences. Manages all editor state and user interactions.
         *
         * Features:
         * - Live HTML preview with XSS protection (DOMPurify sanitization)
         * - Revision history saved to localStorage with timestamps
         * - Dark mode toggle with persistent user preference
         * - Toolbar with markdown formatting shortcuts
         * - 50KB size limit for optimal performance
         * - Separation of concerns via markdownService and revisionStore helpers
         *
         * Data Properties:
         * - contentMarkdown: Current markdown text (persisted to browser storage)
         * - contentHtml: Rendered HTML preview (sanitized for security)
         * - contentRevisions: Array of timestamped revision objects
         * - toolbarGroupClass: Shared Tailwind class string for grouped button wrappers
         * - toolbarButtonClass: Shared Tailwind class string for square toolbar buttons
         * - menuTriggerButtonClass: Shared Tailwind class string for revision menu trigger
         * - notificationMessages: Active notification queue for stacked alerts
         * - notificationTimeouts: Timeout ids keyed by notification id
         * - isFullscreen: Boolean toggle to hide preview pane for full-width editing
         * - isTabCaptured: Whether Tab indents (true) or moves focus (false, after Escape)
         * - showRevisionMenu: Boolean toggle for revision menu visibility
         */
        Alpine.data('markdownEditor', () => ({
          contentMarkdown: Alpine.$persist(DEFAULT_MARKDOWN),
          contentHtml: '',
          contentRevisions: [],
          toolbarGroupClass:
            'flex items-center gap-1 p-1 border rounded-lg bg-surface border-line',
          toolbarButtonClass:
            'size-8 rounded-md grid place-content-center text-xs font-medium text-ink transition-colors hover:bg-hover active:bg-active focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-inset',
          menuTriggerButtonClass:
            'h-8 px-2 rounded-md text-ink transition-colors hover:bg-hover active:bg-active focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-inset flex items-center gap-2',
          selectedRevisionKey: DEFAULT_REVISION_KEY,
          selectedRevisionLabel: DEFAULT_REVISION_LABEL,
          notificationMessages: [],
          notificationTimeouts: {},
          isFullscreen: Alpine.$persist(false),
          isTabCaptured: true,
          showRevisionMenu: false,
          shortcutModifier: SHORTCUT_MODIFIER,
          characterLimitLabel: MAX_MARKDOWN_SIZE.toLocaleString(),

          /**
           * Initializes component state
           * @description Loads persisted revisions into the revision dropdown on startup.
           */
          init() {
            this.setRevisions()
          },

          get characterCount() {
            return this.contentMarkdown.length
          },

          get wordCount() {
            const trimmedContent = this.contentMarkdown.trim()

            return trimmedContent ? trimmedContent.split(/\s+/).length : 0
          },

          get isNearSizeLimit() {
            return (
              this.contentMarkdown.length >=
              MAX_MARKDOWN_SIZE * NEAR_SIZE_LIMIT_RATIO
            )
          },

          /**
           * Closes the revision menu and optionally returns focus to the trigger button
           * @param {boolean} shouldFocusTrigger - Whether to focus the trigger after closing
           * @description Skips focus restoration for click-away close to avoid stealing focus.
           */
          closeRevisionMenu(shouldFocusTrigger = true) {
            this.showRevisionMenu = false

            if (shouldFocusTrigger) {
              this.$refs.revisionMenuTrigger.focus()
            }
          },

          /**
           * Toggles revision menu visibility
           * @description Delegates open and close behavior to dedicated handlers.
           */
          toggleRevisionMenu() {
            if (this.showRevisionMenu) {
              this.closeRevisionMenu()

              return
            }

            this.showRevisionMenu = true
          },

          /**
           * Loads a selected revision and closes the revision menu
           * @param {string} localStorageRevisionKey - The localStorage key of revision to load
           * @param {string} localStorageRevisionLabel - Display label for the selected revision
           * @description Loads selected revision content and restores focus to the menu trigger.
           */
          selectRevision(localStorageRevisionKey, localStorageRevisionLabel) {
            this.useRevision(localStorageRevisionKey, localStorageRevisionLabel)
            this.closeRevisionMenu()
          },

          /**
           * Deletes one revision and closes the revision menu
           * @param {string} localStorageRevisionKey - The localStorage key of revision to delete
           * @description Removes a single revision entry and returns focus to the menu trigger.
           */
          removeRevision(localStorageRevisionKey) {
            this.deleteRevision(localStorageRevisionKey)
            this.closeRevisionMenu()
          },

          /**
           * Deletes all revisions and closes the revision menu
           * @description Clears revision history and restores focus to the menu trigger.
           */
          removeAllRevisions() {
            this.deleteRevisions()
            this.closeRevisionMenu()
          },

          /**
           * Applies a toolbar or shortcut formatting action
           * @param {string} syntaxBefore - Opening marker, or the full marker for block syntax
           * @param {string} [syntaxAfter] - Closing marker for inline syntax
           * @description
           * Block markers (headings, lists, quotes, tasks) go to the start of every
           * line the selection touches. Inline markers wrap the selection itself.
           */
          modifyMarkdown(syntaxBefore, syntaxAfter) {
            const markdownTextarea = this.$refs.textarea

            const isBlockSyntax =
              !syntaxAfter &&
              Object.hasOwn(BLOCK_SYNTAX_PATTERNS, syntaxBefore)

            const syntaxResult = isBlockSyntax
              ? markdownService.applyBlockSyntax(
                  markdownTextarea.value,
                  markdownTextarea.selectionStart,
                  markdownTextarea.selectionEnd,
                  syntaxBefore,
                )
              : markdownService.applyInlineSyntax(
                  markdownTextarea.value,
                  markdownTextarea.selectionStart,
                  markdownTextarea.selectionEnd,
                  syntaxBefore,
                  syntaxAfter ?? '',
                )

            this.applySyntaxResult(syntaxResult)
          },

          /**
           * Writes a syntax result back to the editor and restores the selection
           * @param {{updatedContent: string, updatedSelectionStart: number, updatedSelectionEnd: number}} syntaxResult
           */
          applySyntaxResult(syntaxResult) {
            const markdownTextarea = this.$refs.textarea

            this.contentMarkdown = syntaxResult.updatedContent

            this.$nextTick(() => {
              markdownTextarea.focus()

              markdownTextarea.setSelectionRange(
                syntaxResult.updatedSelectionStart,
                syntaxResult.updatedSelectionEnd,
              )
            })
          },

          /**
           * Indents with Tab, or lets Tab move focus once Escape has been pressed
           * @param {KeyboardEvent} keyEvent - The Tab keydown event
           * @description
           * Trapping Tab is what makes indented code and nested lists workable, but
           * it also traps keyboard users. Escape releases the trap so the next Tab
           * leaves the editor; focusing the textarea again re-arms it.
           */
          handleTabKey(keyEvent) {
            if (!this.isTabCaptured) {
              return
            }

            keyEvent.preventDefault()

            const markdownTextarea = this.$refs.textarea

            this.applySyntaxResult(
              markdownService.applyIndent(
                markdownTextarea.value,
                markdownTextarea.selectionStart,
                markdownTextarea.selectionEnd,
                keyEvent.shiftKey,
              ),
            )
          },

          /**
           * Copies current markdown content to clipboard
           * @description Shows success notification on copy and error notification on failure.
           */
          async copyMarkdown() {
            try {
              await navigator.clipboard.writeText(this.contentMarkdown)

              this.showNotification('Copied to clipboard', { iconText: '🎉' })
            } catch {
              this.showNotification(
                'Your browser blocked clipboard access. Select the text and copy it manually.',
                { iconText: '❌', isAssertive: true },
              )
            }
          },

          /**
           * Validates markdown content doesn't exceed 50KB size limit
           * @description
           * Truncates content in real-time if limit is exceeded.
           * Called on every input change for immediate feedback.
           * Shows notification when limit is reached.
           */
          validateMarkdownSize() {
            const markdownSizeValidation = markdownService.enforceSizeLimit(
              this.contentMarkdown,
            )

            this.contentMarkdown = markdownSizeValidation.validatedContent

            if (markdownSizeValidation.exceedsSizeLimit) {
              this.showNotification(
                `Trimmed to the ${this.characterLimitLabel} character limit`,
                { iconText: '⚠️', isAssertive: true },
              )
            }
          },

          /**
           * Saves current markdown as a timestamped revision to localStorage
           * @description
           * Stores with key pattern _TM_{timestamp}. Auto-triggered after 20s of inactivity
           * (debounced) and manually via the Save revision button.
           */
          saveRevision() {
            revisionStore.saveEntry(this.contentMarkdown)

            this.setRevisions()
          },

          /**
           * Saves a revision from the toolbar and confirms it
           * @description Autosave stays silent; an explicit save gets an explicit response.
           */
          saveRevisionManually() {
            this.saveRevision()

            this.showNotification('Revision saved', { iconText: '📌' })
          },

          /**
           * Auto-saves only when content changed from the latest revision
           * @description Prevents duplicate revisions when no markdown edits occurred.
           */
          autoSaveRevision() {
            if (!this.hasContentChangedSinceLatestRevision()) {
              return
            }

            this.saveRevision()
          },

          /**
           * Checks whether current editor content differs from latest saved revision
           * @returns {boolean} True when content should be saved as a new revision
           */
          hasContentChangedSinceLatestRevision() {
            const [latestRevision] = this.contentRevisions

            if (!latestRevision) {
              return true
            }

            const latestRevisionContent = revisionStore.getEntry(
              latestRevision.revisionKey,
            )

            return latestRevisionContent !== this.contentMarkdown
          },

          /**
           * Deletes a single revision from localStorage
           * @param {string} localStorageRevisionKey - The localStorage key of revision to delete
           * @description Updates revision list after deletion.
           */
          deleteRevision(localStorageRevisionKey) {
            revisionStore.removeEntry(localStorageRevisionKey)

            if (this.selectedRevisionKey === localStorageRevisionKey) {
              this.selectedRevisionKey = DEFAULT_REVISION_KEY
              this.selectedRevisionLabel = DEFAULT_REVISION_LABEL
            }

            this.setRevisions()
          },

          /**
           * Deletes all revisions from localStorage
           * @description Clears entire revision history. Updates revision list after deletion.
           */
          deleteRevisions() {
            revisionStore.removeAllEntries()

            this.selectedRevisionKey = DEFAULT_REVISION_KEY
            this.selectedRevisionLabel = DEFAULT_REVISION_LABEL

            this.setRevisions()
          },

          /**
           * Loads and displays all timestamped revisions from localStorage
           * @description
           * Queries localStorage for all _TM_* keys, sorts by timestamp (newest first),
           * formats timestamps to locale strings, and updates revision array for rendering.
           * Called after save/delete operations to refresh revision menu.
           */
          setRevisions() {
            this.contentRevisions = revisionStore.listEntries()

            const selectedRevisionExists = this.contentRevisions.some(
              (contentRevision) =>
                contentRevision.revisionKey === this.selectedRevisionKey,
            )

            if (!selectedRevisionExists) {
              this.selectedRevisionKey = DEFAULT_REVISION_KEY
              this.selectedRevisionLabel = DEFAULT_REVISION_LABEL
            }
          },

          /**
           * Loads a previous revision into the editor
           * @param {string} localStorageRevisionKey - The localStorage key of revision to load
           * @param {string} localStorageRevisionLabel - Display label for the revision (formatted date)
           * @description Replaces current content with selected revision and updates UI label.
           */
          useRevision(localStorageRevisionKey, localStorageRevisionLabel) {
            this.contentMarkdown = revisionStore.getEntry(
              localStorageRevisionKey,
            )

            this.selectedRevisionKey = localStorageRevisionKey
            this.selectedRevisionLabel = localStorageRevisionLabel
          },

          /**
           * Exports current markdown content as a .md file
           * @description Creates a timestamped markdown file download in the browser.
           */
          exportMarkdownDocument() {
            exportService.exportMarkdown(this.contentMarkdown)

            this.showNotification('Exported as markdown', { iconText: '🎉' })
          },

          /**
           * Schedules a preview render
           * @description
           * Tracked by x-effect, so it reads contentMarkdown synchronously and then
           * debounces the actual parse. Without the debounce every keystroke reparses
           * and rebuilds the whole preview, which is the difference between typing
           * feeling instant and feeling like it is fighting the page.
           */
          refreshHtml() {
            const markdownContent = this.contentMarkdown

            if (!hasRenderedInitialHtml) {
              hasRenderedInitialHtml = true

              this.renderHtml(markdownContent)

              return
            }

            clearTimeout(renderTimeoutId)

            renderTimeoutId = setTimeout(
              () => this.renderHtml(markdownContent),
              RENDER_DEBOUNCE,
            )
          },

          /**
           * Parses markdown to HTML and sanitizes for secure display
           * @param {string} markdownContent - Markdown to render
           * @description
           * Uses marked.js to convert markdown to HTML and sanitizes output with DOMPurify
           * to prevent XSS attacks. If parsing fails, uses a strict DOMPurify allowlist
           * to render the raw markdown content as sanitized fallback output.
           * Preserves preview scroll position across the swap, and only warns when
           * the document first fails to parse rather than on every keystroke.
           */
          renderHtml(markdownContent) {
            const previewElement = this.$refs.preview
            const previousScrollTop = previewElement?.scrollTop ?? 0

            const renderedMarkdown =
              markdownService.renderSanitizedHtml(markdownContent)

            this.contentHtml = renderedMarkdown.sanitizedHtml

            if (renderedMarkdown.containsParseError && !hasPreviewParseError) {
              this.showNotification(
                'Preview unavailable. Check for an unclosed code fence or table.',
                { iconText: '⚠️', isAssertive: true },
              )
            }

            hasPreviewParseError = renderedMarkdown.containsParseError

            this.$nextTick(() => {
              if (previewElement) {
                this.withScrollLock(() => {
                  previewElement.scrollTop = previousScrollTop
                })
              }
            })
          },

          /**
           * Runs a programmatic scroll without it echoing back through scroll sync
           * @param {Function} scrollAction - The scroll mutation to perform
           */
          withScrollLock(scrollAction) {
            isSyncingScroll = true

            scrollAction()

            requestAnimationFrame(() => {
              isSyncingScroll = false
            })
          },

          /**
           * Keeps the editor and preview at the same relative scroll position
           * @param {HTMLElement} sourceElement - The pane the user scrolled
           * @param {HTMLElement} targetElement - The pane to follow along
           * @description
           * Proportional rather than line-mapped, which is imprecise on documents
           * with tall images or code blocks but costs nothing and is far better
           * than the two panes drifting apart. Only runs in the side-by-side layout.
           */
          syncPaneScroll(sourceElement, targetElement) {
            if (isSyncingScroll || !targetElement) {
              return
            }

            if (!globalThis.matchMedia(DESKTOP_MEDIA_QUERY).matches) {
              return
            }

            const sourceScrollable =
              sourceElement.scrollHeight - sourceElement.clientHeight

            const targetScrollable =
              targetElement.scrollHeight - targetElement.clientHeight

            if (sourceScrollable <= 0 || targetScrollable <= 0) {
              return
            }

            this.withScrollLock(() => {
              targetElement.scrollTop =
                (sourceElement.scrollTop / sourceScrollable) * targetScrollable
            })
          },

          /**
           * Displays a temporary notification message to the user
           * @param {string} textContent - Message text, read aloud by assistive tech
           * @param {{iconText?: string, isAssertive?: boolean}} [notificationOptions]
           * @description
           * The icon is kept out of textContent so screen readers announce the
           * message rather than the name of an emoji. Only messages that need to
           * interrupt are assertive; confirmations wait their turn.
           */
          showNotification(textContent, notificationOptions = {}) {
            const { iconText = '', isAssertive = false } = notificationOptions

            const notificationMessage = notificationService.createNotification(
              textContent,
              iconText,
              isAssertive,
            )

            this.notificationMessages = notificationService.addNotification(
              this.notificationMessages,
              notificationMessage,
            )

            // Trigger enter transition after the node exists in the DOM.
            this.$nextTick(() => {
              this.notificationMessages =
                notificationService.setNotificationVisibility(
                  this.notificationMessages,
                  notificationMessage.notificationId,
                  true,
                )
            })

            const timeoutId = setTimeout(
              () => this.hideNotification(notificationMessage.notificationId),
              NOTIFICATION_DURATION,
            )

            this.notificationTimeouts = notificationService.addTimeout(
              this.notificationTimeouts,
              notificationMessage.notificationId,
              timeoutId,
            )
          },

          /**
           * Starts leave transition for a notification and removes it after animation.
           * @param {number} notificationId - The unique id of the notification
           */
          hideNotification(notificationId) {
            const notificationToHide = notificationService.findNotification(
              this.notificationMessages,
              notificationId,
            )

            if (!notificationToHide) {
              return
            }

            const timeoutId = this.notificationTimeouts[notificationId]

            if (timeoutId) {
              clearTimeout(timeoutId)
            }

            this.notificationMessages =
              notificationService.setNotificationVisibility(
                this.notificationMessages,
                notificationId,
                false,
              )

            const newTimeoutId = setTimeout(
              () => this.removeNotification(notificationId),
              NOTIFICATION_LEAVE_DURATION,
            )

            this.notificationTimeouts = notificationService.addTimeout(
              this.notificationTimeouts,
              notificationId,
              newTimeoutId,
            )
          },

          /**
           * Removes a notification by id and clears its pending timer
           * @param {number} notificationId - The unique id of the notification
           */
          removeNotification(notificationId) {
            const timeoutId = this.notificationTimeouts[notificationId]

            if (timeoutId) {
              clearTimeout(timeoutId)

              this.notificationTimeouts = notificationService.removeTimeout(
                this.notificationTimeouts,
                notificationId,
              )
            }

            this.notificationMessages = notificationService.removeNotification(
              this.notificationMessages,
              notificationId,
            )
          },

          /**
           * Clears the editor back to the starter document
           * @description
           * Saves the outgoing draft as a revision first, so an accidental click is
           * recoverable from the revision menu instead of needing a confirm dialog.
           */
          startOver() {
            const hasDraftWorthKeeping =
              this.contentMarkdown.trim() !== '' &&
              this.contentMarkdown !== DEFAULT_MARKDOWN

            if (!hasDraftWorthKeeping) {
              this.contentMarkdown = DEFAULT_MARKDOWN

              return
            }

            this.saveRevision()

            this.contentMarkdown = DEFAULT_MARKDOWN

            this.showNotification(
              'Cleared. Your previous draft is in the revision menu.',
              { iconText: '↩️' },
            )
          },

          /**
           * Toggles between full-width and split-pane layout
           * @description Hides preview pane when fullscreen is enabled for distraction-free editing.
           */
          toggleFullscreen() {
            this.isFullscreen = !this.isFullscreen
          },
        }))
      })
    </script>

    <script src="https://cdn.jsdelivr.net/npm/marked@17.0/lib/marked.umd.min.js"></script>
  </body>
